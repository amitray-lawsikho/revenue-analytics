<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sales Analytics Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>try { const t = localStorage.getItem("sa-theme"); if (t) document.documentElement.dataset.theme = t; } catch (_) {}</script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="config.js"></script>
</head>
<body>
  <!-- Sign in -->
  <section id="auth" class="auth" hidden>
    <div class="auth-card">
      <div class="brand"><span class="logo">SA</span><span>Sales Analytics Dashboard</span></div>
      <p class="muted">Sign in with your work email. Only approved emails can see data.</p>
      <form id="auth-form">
        <label>Email <input id="auth-email" type="email" autocomplete="username" required></label>
        <label>Password <input id="auth-pass" type="password" autocomplete="current-password" minlength="8" required></label>
        <button type="submit" class="btn primary">Sign in</button>
        <button type="button" id="auth-signup" class="btn ghost">First time? Create account</button>
      </form>
      <p id="auth-msg" class="msg"></p>
    </div>
  </section>

  <div id="app" class="shell" hidden>
    <aside class="side" id="side">
      <div class="brand"><span class="logo">SA</span><span>Sales Analytics<br><small>Dashboard</small></span></div>
      <nav>
        <div class="nav-h">Revenue Metrics</div>
        <a href="#overall" data-page="overall"><svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M8 15l4-4 3 3 5-6"/></svg>Overall Performance</a>
        <a href="#vertical" data-page="vertical"><svg viewBox="0 0 24 24"><path d="M3 7h18M3 12h18M3 17h18"/></svg>Vertical Wise Performance</a>
        <a href="#team" data-page="team"><svg viewBox="0 0 24 24"><circle cx="8" cy="9" r="3"/><circle cx="16" cy="9" r="3"/><path d="M3 19c1-3 3-4 5-4s4 1 5 4M11 19c1-3 3-4 5-4s4 1 5 4"/></svg>Teamwise Performance</a>
        <a href="#caller" data-page="caller"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c1.2-4 4-5.5 7-5.5s5.8 1.5 7 5.5"/></svg>Caller Wise Performance</a>
      </nav>
      <div class="side-foot">
        <button id="update" class="btn primary block"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg>Update data</button>
        <div id="update-msg" class="small muted"></div>
        <div id="fresh" class="small muted"></div>
        <div class="side-row">
          <button id="theme" class="btn ghost sm"></button>
          <button id="signout" class="btn ghost sm">Sign out</button>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="page-h">
        <button id="menu" class="btn ghost sm menu-btn" aria-label="Menu">☰</button>
        <div>
          <h1 id="page-title">Overall Performance</h1>
          <p id="page-sub" class="muted small"></p>
        </div>
        <button id="download" class="btn sm"><svg viewBox="0 0 24 24"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/></svg>Download Excel</button>
      </header>

      <section class="filters card">
        <div class="seg" id="presets">
          <button data-p="today">Today</button><button data-p="yesterday">Yesterday</button>
          <button data-p="week">This week</button><button data-p="month">This month</button>
          <button data-p="lastmonth">Last month</button><button data-p="all">All years</button>
        </div>
        <div class="filter-row">
          <label>Financial year <select id="fy"><option value="">Custom dates</option></select></label>
          <label>From <input type="date" id="from"></label>
          <label>To <input type="date" id="to"></label>
          <label>View by <select id="grain"><option value="day">Day</option><option value="week">Week</option>
            <option value="month">Month</option><option value="fy">Financial year</option></select></label>
          <label data-for="vertical team caller">Vertical <select id="f-vertical"><option value="">All verticals</option></select></label>
          <label data-for="team caller">Team <select id="f-team"><option value="">All teams</option></select></label>
          <label data-for="caller">Caller type <select id="f-status">
            <option value="">All</option><option value="current">Current callers</option><option value="resigned">Resigned / not in Teamlist</option>
            <option value="direct">Direct</option><option value="no caller">Lead details not available</option></select></label>
          <label data-for="caller">Caller <input id="f-caller" list="callers" placeholder="Search a name"><datalist id="callers"></datalist></label>
        </div>
      </section>

      <div id="content"></div>
    </main>

    <aside id="drawer" class="drawer" hidden>
      <div class="drawer-h"><h2 id="d-name"></h2><button id="d-close" class="btn ghost sm">✕</button></div>
      <p id="d-sub" class="muted small"></p>
      <div class="kpis" id="d-kpis"></div>
      <div class="card"><h3>Revenue and new enrolments</h3><div class="chart-box"><canvas id="d-trend"></canvas></div></div>
      <div class="card"><h3>Top courses</h3><div class="table-wrap"><table id="d-courses"></table></div></div>
    </aside>
  </div>
  <script src="app.js"></script>
</body>
</html>
